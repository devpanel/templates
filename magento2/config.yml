version: "1.1"
spec:
  servicePort: 80
  hostname: ""
  sharedDir:
    path: /var/www/html
    storage: '5Gi'
  podTemplate:
    containers:
      - name: php
        image: 'devpanel/php-fpm:7.2'
        env:
          - name: "APP_ROOT"
            value: "/var/www/html"
        ports:
          - containerPort: 9000
            name: fastcgi
          - containerPort: 8080
            name: coseserver
      - name: nginx
        image: 'wodby/nginx:latest'
        env:
          - name: NGINX_SERVER_ROOT
            value: "/var/www/html/pub"
          - name: "NGINX_VHOST_PRESET"
            value: "magento2"
          - name: NGINX_BACKEND_HOST
            value: '0.0.0.0'
        ports:
          - containerPort: 80
            name: http
          - containerPort: 443
            name: https